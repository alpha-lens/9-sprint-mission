spring:
  boot:
    admin:
      client:
        instance:
          name: discodeit
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  output:
    ansi:
      enabled: ALWAYS # 또는 DETECT
  application:
    name: "discodeit"
  profiles:
    active: dev

logging:
  level:
    root: info

server:
  port: ${PORT:8080}

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
  repository:
    type: jpa
    file-directory: .discodeit