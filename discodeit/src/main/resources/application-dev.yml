spring:
  datasource:
    url: jdbc:h2:mem:dividends;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html  # 접속 경로 설정
    groups-order: DESC
  api-docs:
    path: /api-docs