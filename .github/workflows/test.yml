name: Java CI with Gradle and CodeCov

on:
  push:
    branches: [ "main", "이진용", "이진용-sprint8" ]
  pull_request:
    branches: [ "main", "이진용" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./discodeit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test with Gradle (H2 Mode)
        run: ./gradlew clean test -Dspring.profiles.active=test
        env:
          AWS_ACCESS_KEY: ${{secrets.AWS_ACCESS_KEY}}
          AWS_SECRET_KEY: ${{secrets.AWS_SECRET_KEY}}
          AWS_REGION: ${{vars.AWS_REGION}}
          AWS_S3_BUCKET: ${{secrets.AWS_BUCKET}}
          SPRING_BOOT_ADMIN_CLIENT_URL: http://localhost:9090

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true