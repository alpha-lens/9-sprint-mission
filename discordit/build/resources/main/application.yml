spring:
  application:
    name: "discodeit"
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      orm:
        jdbc:
          bind: TRACE

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html  # 접속 경로 설정
    groups-order: DESC
  api-docs:
    path: /api-docs

discodeit:
  storage:
    type: local
    local:
      root-path: ./.discodeit-storage
  repository:
    type: jpa
    file-directory: .discodeit